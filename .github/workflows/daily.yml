# Daily pipeline: extract job postings -> BigQuery raw -> dbt build -> rebuild the dashboard.
name: daily

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6-7am US Eastern, after most boards' overnight updates
  workflow_dispatch:

# Never let two runs write the same day's partition at once.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install -r requirements.txt

      # Writes the key to a temp file and sets GOOGLE_APPLICATION_CREDENTIALS, which both
      # the BigQuery client and dbt's `method: oauth` pick up.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Extract postings to raw
        run: python -m extract

      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Source freshness
        run: dbt source freshness --project-dir dbt --profiles-dir dbt

      - name: dbt build (models + tests)
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Build dashboard
        run: python -m dashboard.build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/site

  # GitHub Pages needs a public repo on the free plan; flip the PAGES_ENABLED repo variable to true once public.
  deploy:
    needs: pipeline
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
