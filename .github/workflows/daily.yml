# Daily pipeline: extract job postings -> BigQuery raw -> dbt build -> rebuild the dashboard.
name: daily

on:
  schedule:
    # Watchdog only: rebuilds and deploys from BigQuery, no extract. Workday's boards have refused GitHub
    # runner IPs since 2026-11-16, so the daily extract runs on a Mac (scripts/daily_local.sh), which
    # triggers this workflow itself. If that extract stops, source freshness fails here after 48 hours.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      skip_extract:
        description: "Rebuild and deploy from data already in BigQuery (e.g. after a local extract)"
        type: boolean
        default: false

# Never let two runs write the same day's partition at once.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install -r requirements.txt

      # Writes the key to a temp file and sets GOOGLE_APPLICATION_CREDENTIALS, which both
      # the BigQuery client and dbt's `method: oauth` pick up.
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Extract postings to raw
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_extract }}
        run: python -m extract

      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Source freshness
        run: dbt source freshness --project-dir dbt --profiles-dir dbt

      - name: dbt build (models + tests)
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Build dashboard
        run: python -m dashboard.build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/site

  # GitHub Pages needs a public repo on the free plan; flip the PAGES_ENABLED repo variable to true once public.
  deploy:
    needs: pipeline
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
