version: 2

models:
  - name: stg_greenhouse__postings
    description: One row per Greenhouse posting per snapshot day, typed and renamed from the raw JSON.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [posting_key, snapshot_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "salary_min <= salary_max"
    columns:
      - name: posting_key
        description: "`ats|company_slug|posting_id`; unique per posting across both ATS."
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]
      - name: company_slug
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('companies')
                field: company_slug
      - name: internal_job_id
        description: Greenhouse's internal job (requisition) id, equal to Harvest `jobs.id`. Present on 99.8% of postings.
      - name: requisition_id
        description: The company's own requisition number, often shared with the HRIS. Present on 93% of postings.
      - name: title
        data_tests: [not_null]
      - name: published_at
        description: Greenhouse `first_published`. A repost resets it.
        data_tests: [not_null]
      - name: workplace_type_raw
        description: Raw value from a company-specific custom field (Airbnb, Anthropic, MongoDB); null for other companies.
      - name: req_open_date
        description: Elastic-only custom field; when the requisition opened.
      - name: salary_min
        description: First pay range from Greenhouse `pay_input_ranges`, converted from cents. May be base, OTE or hourly; see `salary_label`.
      - name: salary_label
        description: The company's own text for the first pay range (e.g. "OTE range", "Hourly Rate:"). Used downstream to decide pay basis.

  - name: stg_workday__postings
    description: One row per Workday posting per snapshot day. Detail fields are fetched once per posting and carried to every day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [posting_key, snapshot_date]
    columns:
      - name: posting_key
        data_tests: [not_null]
      - name: posting_id
        description: The posting's externalPath on the career site.
      - name: company_slug
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('companies')
                field: company_slug
      - name: title
        data_tests: [not_null]
      - name: published_at
        description: Workday `startDate`. NULL until the posting's detail call succeeds (normally its first run).
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: requisition_id
        description: Workday `jobReqId`, the requisition number shared with Workday HCM.

  - name: stg_ashby__postings
    description: One row per Ashby posting per snapshot day, typed and renamed from the raw JSON.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [posting_key, snapshot_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "salary_min <= salary_max"
    columns:
      - name: posting_key
        description: "`ats|company_slug|posting_id`; unique per posting across both ATS."
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]
      - name: company_slug
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('companies')
                field: company_slug
      - name: title
        data_tests: [not_null]
      - name: published_at
        description: Ashby `publishedAt`.
        data_tests: [not_null]
      - name: workplace_type_raw
        description: Ashby `workplaceType`; null when the company didn't set it.
        data_tests:
          - accepted_values:
              arguments:
                values: [Hybrid, Remote, OnSite]
      - name: employment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [FullTime, PartTime, Intern, Contract, Temporary]
              config:
                severity: warn
      - name: salary_min
        description: Base salary range from Ashby's Salary component, in `salary_currency` per `salary_interval`.

  - name: stg_extract_runs
    description: One row per company per extraction attempt, success or failure.
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [success, failed]
      - name: company_slug
        data_tests: [not_null]

  - name: stg_harvest__applications
    description: SYNTHETIC. One row per Harvest application (prospects excluded).
    columns:
      - name: application_id
        data_tests: [unique, not_null]
      - name: job_id
        description: Harvest `jobs.id`, equal to the public board's `internal_job_id`.
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [active, rejected, hired]

  - name: stg_harvest__job_stages
    description: SYNTHETIC. One row per stage of each job's interview plan.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [job_id, stage_order]
    columns:
      - name: stage_id
        data_tests: [unique, not_null]

  - name: stg_harvest__offers
    description: SYNTHETIC. One row per offer.
    columns:
      - name: offer_id
        data_tests: [unique, not_null]
      - name: offer_status
        data_tests:
          - accepted_values:
              arguments:
                values: [accepted, rejected, unresolved, deprecated]
