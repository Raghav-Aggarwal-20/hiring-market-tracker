version: 2

models:
  - name: dim_company
    description: One row per tracked company with its ATS, peer group and first tracked date.
    columns:
      - name: company_slug
        data_tests: [unique, not_null]

  - name: dim_posting
    description: >
      One row per posting ever seen. Attributes come from the posting's latest sighting; lifecycle columns say
      when it was first and last seen and whether it has closed.
    columns:
      - name: posting_key
        data_tests: [unique, not_null]
      - name: company_slug
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_slug
      - name: reported_age_days
        description: Days since the ATS publish date, as of the last sighting (or the close date). Reposts reset it.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 3650
              config:
                severity: warn
      - name: salary_midpoint_usd
        description: Midpoint of the posted range, only when `is_pay_usable` (USD, annual, $20K-$2M, not sales).
      - name: is_open
        data_tests: [not_null]

  - name: fct_company_daily
    description: >
      One row per company per snapshot day. Counts are NULL on failed extract days; `new_postings` and `net_change`
      are NULL on a company's first tracked day (the baseline).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [company_slug, snapshot_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "open_data_roles <= open_postings and open_remote_postings <= open_postings"
    columns:
      - name: company_slug
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_slug

  - name: fct_postings_current
    description: Open postings at active companies, as of each company's latest successful extract. Main dashboard table.
    columns:
      - name: posting_key
        data_tests: [unique, not_null]

  - name: rpt_postings_current
    description: fct_postings_current plus readable labels and a 4-group peer lens. Dashboard source for pages 1-2.
    columns:
      - name: posting_key
        data_tests: [unique, not_null]
      - name: workplace_label
        data_tests:
          - accepted_values:
              arguments:
                values: [Remote, Hybrid, Onsite, Not stated]

  - name: rpt_company_summary
    description: One row per active company with today's counts, function shares (0-1), exact median and p75 posting age, and median usable salary midpoint.
    columns:
      - name: company_slug
        data_tests: [unique, not_null]

  - name: rpt_company_daily
    description: fct_company_daily with company names and peer lens. Dashboard source for the trends page.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [company_slug, snapshot_date]

  - name: rpt_pipeline_health
    description: One row per active company with its latest extract status and data-quality coverage shares.
    columns:
      - name: company_slug
        data_tests: [unique, not_null]

  - name: fct_applications
    description: >
      SYNTHETIC funnel. One row per application, joined to its real posting through internal_job_id.
      `furthest_stage_order` is the current stage (rejections stay on the stage they happened at), or the last
      stage for hires.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_harvest__applications')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_hired or offer_status = 'accepted'"
    columns:
      - name: application_id
        data_tests: [unique, not_null]
      - name: furthest_stage_order
        data_tests: [not_null]

  - name: fct_requisition_funnel
    description: SYNTHETIC funnel. One row per job per interview stage, with pass-through from the previous stage.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [job_id, stage_order]
    columns:
      - name: pass_through_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: fct_time_to_fill
    description: >
      One row per requisition: real public posting dates next to the SYNTHETIC hire. Time to fill counts from the
      ATS publish date, which a repost resets.
    columns:
      - name: job_id
        description: Unique, so no requisition has two hires.
        data_tests: [unique, not_null]
      - name: requisition_status
        data_tests:
          - accepted_values:
              arguments:
                values: [filled, open, closed_unfilled]

  - name: dim_requisition
    description: >
      One row per Greenhouse requisition (`internal_job_id`, Harvest `jobs.id`). Real data. A requisition with
      several postings is open while any of them is, and closes with the last.
    columns:
      - name: job_id
        data_tests: [unique, not_null]
